<head>

  <meta name="twitter:title" content="A.z — The Collections" />

  <style>html,body{margin:0;background:#f5efe8}</style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f5efe8'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-style='italic' font-size='30' fill='%237a2c3d' text-anchor='middle'%3EAZ%3C/text%3E%3C/svg%3E" />
  <!-- The page is led by its type and by one photograph: both are fetched
       with the stylesheet rather than after it, so the headline is never
       first drawn in a fallback face. -->
  <link rel="preload" as="font" type="font/woff2" href="fonts/cormorant-500.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="fonts/cormorant-500-italic.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="fonts/jost-300.woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ---------- Collection page ---------- */
    .range { max-width: 1320px; margin: 0 auto; padding: 140px clamp(18px, 5vw, 60px) 90px; }
    /* headed to the left, on a rule, as every other page is */
    .range-head { margin-bottom: 8px; padding-top: 26px; border-top: 1px solid var(--line-2);
      display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 20px; }
    .range-head .range-kicker { grid-column: 2; grid-row: 1 / span 2; align-self: start; padding-top: 8px; }
    .range-head .range-title, .range-head .range-lead { grid-column: 1; }
    .range-head .range-nav { grid-column: 1 / -1; }
    .range-kicker { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
    .range-title { font-family: var(--serif); font-weight: 500; font-size: clamp(44px, 6.4vw, 86px);
      line-height: .98; letter-spacing: -.028em; color: var(--ink); margin-top: 16px; }
    .range-lead { margin-top: 18px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .range .grid { margin-top: 52px; max-width: none; }
    /* cut-out objects (watches, hats…) sit whole in the frame, never cropped */
    .grid--objects .card-media img { object-fit: contain; padding: 14% 12%; }
    /* an empty collection is an appointment, not an absence */
    .range-soon { text-align: center; padding: 72px 24px 30px; }
    .range-soon span { display: block; color: var(--gold); font-size: 14px; }
    .range-soon em { display: block; font-family: var(--serif); font-style: italic; font-size: clamp(24px, 3.6vw, 32px); color: var(--ink-2); margin-top: 16px; }
    .range-soon p { max-width: 430px; margin: 18px auto 0; font-size: 14px; line-height: 1.95; color: var(--ink-2); }
    .range-soon .btn { margin-top: 30px; }
    /* The collections are read as a line of words, separated by hairlines and
       marked by a fine rule — four boxed buttons looked like a toolbar. */
    .range-nav { display: flex; justify-content: flex-start; align-items: center;
      flex-wrap: wrap; margin-top: 44px;
      border-block: 1px solid rgba(43,34,38,.1); padding: 4px 0; }
    .range-nav a:first-child { padding-left: 0; }
    .range-nav a:first-child::after { left: 0; }
    .range-nav a { position: relative; padding: 14px clamp(16px, 2.4vw, 30px);
      font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
      transition: color .35s var(--ease); }
    .range-nav a + a::before {
      content: ""; position: absolute; left: 0; top: 50%; width: 1px; height: 12px; margin-top: -6px;
      background: rgba(43,34,38,.14);
    }
    .range-nav a::after {
      content: ""; position: absolute; left: clamp(16px, 2.4vw, 30px); right: clamp(16px, 2.4vw, 30px);
      bottom: 6px; height: 1px; background: var(--gold-2);
      transform: scaleX(0); transform-origin: center; transition: transform .45s var(--ease);
    }
    .range-nav a:hover { color: var(--ink); }
    .range-nav a:hover::after { transform: scaleX(.4); }
    .range-nav a.on { color: var(--gold-2); }
    .range-nav a.on::after { transform: scaleX(1); }
    @media (max-width: 880px) { .range { padding-top: 108px; } }
    @media (max-width: 560px) {
      .range-nav { gap: 0; }
      .range-nav a { padding: 12px 11px; font-size: 9px; letter-spacing: .18em; }
      .range-nav a::after { left: 11px; right: 11px; }
    }
  </style>
  <link rel="stylesheet" href="atelier.css" />
</head>
<body>
  <header class="topbar scrolled" id="topbar">
    <a href="index.html" class="brand" aria-label="A.z — home"><img class="brand-logo" src="images/logo-ink.png" alt="A.z" /></a>
    <nav class="nav">
      <a href="index.html#collection">Collection</a>
      <a href="eyewear.html">The Eyewear</a>
      <a href="advisory.html">The Advisory</a>
      <a href="index.html#enquire">Enquire</a>
    </nav>
  </header>

  <main class="range">
    <div class="range-head">
      <p class="range-kicker">The Vitrine</p>
      <h1 class="range-title" id="rTitle"></h1>
      <p class="range-lead" id="rLead"></p>
      <nav class="range-nav" id="rNav" aria-label="Collections"></nav>
    </div>
    <div class="grid" id="rGrid"></div>
    <div class="range-soon" id="rSoon" style="display:none">
      <span>✦</span>
      <em>Private viewing — on request</em>
      <p>This collection is arriving to the salon. Speak to an advisor and we will open it for you first, piece by piece, before it is shown to anyone else.</p>
      <a class="btn btn--solid" href="index.html#enquire">Speak to an Advisor</a>
    </div>
  </main>

  <footer class="footer">
    <img class="footer-logo" src="images/logo.png" alt="A.z" />
    <div class="footer-rule" aria-hidden="true"></div>
    <span class="footer-copy">© A.z — By Appointment</span>
  </footer>

  <script src="content.js"></script>
  <script src="fill.js"></script>
  <script src="bags.js"></script>
  <script>
  (function () {
    "use strict";
    var qs = new URLSearchParams(location.search);
    var col = qs.get("c") || "bags";
    if (!RANGES[col]) col = Object.keys(RANGES)[0];
    var range = RANGES[col];
    if (!range) {
      document.getElementById('rTitle').textContent = 'The next edit';
      document.getElementById('rLead').textContent = 'Speak to an advisor about what you have in mind.';
      document.getElementById('rSoon').style.display = '';
      return;
    }

    document.title = "A.z — " + range.title;
    document.getElementById("rTitle").textContent = range.title;
    document.getElementById("rLead").textContent = range.lead;

    /* collection switcher */
    var nav = document.getElementById("rNav");
    Object.keys(RANGES).forEach(function (k) {
      var a = document.createElement("a");
      a.href = "range.html?c=" + k;
      a.textContent = RANGES[k].title.replace("The ", "");
      if (k === col) { a.className = "on"; a.setAttribute('aria-current','page'); }
      nav.appendChild(a);
    });

    var items = range.items || [];
    if (!items.length) {
      document.getElementById("rSoon").style.display = "";
      return;
    }

    var grid = document.getElementById("rGrid");
    if (col !== "bags") grid.classList.add("grid--objects");
    items.forEach(function (it, idx) {
      var first = (it.variants || [])[0] || {};
      var shot = (first.shots || [])[0] || "";
      var num = String(idx + 1).padStart(2, "0");
      var a = document.createElement("a");
      a.className = "card in";
      a.style.transitionDelay = (idx % 3) * 90 + "ms";
      a.href = "piece.html?id=" + idx + (col === "bags" ? "" : "&c=" + col);
      a.innerHTML =
        '<div class="card-media">' +
          '<span class="card-tag">' + (it.tag || "") + '</span>' +
          '<span class="card-index">' + num + '</span>' +
          '<img alt="' + (it.name || "") + '" loading="lazy" src="' + shot + '" />' +
        '</div>' +
        '<div class="card-info">' +
          '<div class="card-name">' + (it.name || "") + '</div>' +
          '<div class="card-note"><span class="note-base">' + (it.note || "") + '</span>' +
            (first.color ? ' · <span class="note-color">' + first.color + '</span>' : "") + '</div>' +
        '</div>';
      grid.appendChild(a);
    });
  })();
  </script>
<script src="atelier.js"></script>
</body>
</html>
