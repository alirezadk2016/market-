<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A little surprise…</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0d0c0a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230d0c0a'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E" />
  <style>
    @font-face{font-family:"Cormorant Garamond";font-weight:400;src:url("fonts/cormorant-400.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Cormorant Garamond";font-weight:500;src:url("fonts/cormorant-500.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:400;src:url("fonts/cormorant-400-italic.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;src:url("fonts/cormorant-500-italic.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Jost";font-weight:300;src:url("fonts/jost-300.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Jost";font-weight:400;src:url("fonts/jost-400.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Vazirmatn";font-weight:400;src:url("fonts/vazirmatn-400.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Vazirmatn";font-weight:500;src:url("fonts/vazirmatn-500.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Gulzar";font-weight:400;src:url("fonts/gulzar-400.woff2") format("woff2");font-display:swap}

    :root{
      --bg:#0d0c0a;--ink:#ece4d4;--ink2:#cdc2ae;--muted:#8d8272;
      --gold:#b8975c;--gold2:#dcc08a;--rose:#d98a86;--line:rgba(184,151,92,.3);
      --serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost","Helvetica Neue",Arial,sans-serif;
      --fa:"Vazirmatn",Tahoma,sans-serif;--nastaliq:"Gulzar","Vazirmatn",serif;
      --ease:cubic-bezier(.22,.61,.36,1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#0d0c0a}
    body{font-family:var(--sans);font-weight:300;color:var(--ink);overflow:hidden;
      background:radial-gradient(90% 70% at 50% 30%,#171410 0%,var(--bg) 62%)}
    canvas#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
    .frame{position:fixed;inset:20px;border:1px solid var(--line);z-index:1;pointer-events:none}
    @media(max-width:560px){.frame{inset:12px}}

    .stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
      justify-content:center;text-align:center;padding:44px 26px;opacity:0;visibility:hidden;
      transform:translateY(14px);transition:opacity .9s var(--ease),transform 1s var(--ease),visibility .9s}
    .stage.on{opacity:1;visibility:visible;transform:none}

    .eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold2);margin-bottom:24px}
    h1{font-family:var(--serif);font-weight:500;line-height:1.04;letter-spacing:-.01em;font-size:clamp(44px,9vw,96px)}
    h1 em{font-style:italic;background:linear-gradient(120deg,var(--gold2),#fff3d6 60%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .name{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(30px,6vw,60px);
      background:linear-gradient(120deg,var(--gold2),#fff3d6 55%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-top:6px}
    .rule{width:64px;height:1px;background:var(--gold);margin:28px 0}
    .fa-sub{font-family:var(--fa);font-weight:400;color:var(--ink2);font-size:clamp(15px,2.4vw,19px);line-height:2.1;direction:rtl;max-width:520px}

    /* Persian romantic note */
    .fa-note{font-family:var(--nastaliq);direction:rtl;color:var(--ink);line-height:2.5;
      font-size:clamp(34px,7vw,72px);
      background:linear-gradient(120deg,#fff3d6,var(--gold2) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .fa-love{font-family:var(--nastaliq);direction:rtl;color:var(--gold2);font-size:clamp(26px,5vw,46px);margin-top:18px}

    .btn{margin-top:44px;display:inline-flex;align-items:center;gap:12px;cursor:pointer;
      padding:15px 40px;border:1px solid var(--gold);background:transparent;color:var(--gold2);
      font-family:var(--fa);font-size:13px;letter-spacing:.06em;
      transition:background .45s var(--ease),color .45s var(--ease)}
    .btn:hover{background:var(--gold);color:#1b1610}
    .btn--solid{background:var(--gold);color:#1b1610}
    .btn--solid:hover{background:var(--gold2)}

    /* ---- Stage 3: rose → gift ---- */
    .rose-wrap{display:flex;flex-direction:column;align-items:center}
    .rose-btn{background:none;border:0;cursor:pointer;padding:0;position:relative;filter:drop-shadow(0 0 26px rgba(220,192,138,.35));
      animation:floaty 4s ease-in-out infinite;transition:transform 1.1s var(--ease),opacity 1s var(--ease)}
    .rose-btn svg{width:clamp(150px,34vw,220px);height:auto;display:block}
    .rose-hint{font-family:var(--fa);direction:rtl;color:var(--gold2);font-size:15px;margin-top:26px;
      animation:pulse 2.4s ease-in-out infinite}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    .rose-wrap.bloom .rose-btn{transform:scale(2.1) rotate(8deg);opacity:0;pointer-events:none}
    .rose-wrap.bloom .rose-hint{opacity:0;transition:opacity .4s}

    .gift-reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:44px 26px;opacity:0;visibility:hidden;transition:opacity 1s var(--ease),visibility 1s}
    .gift-reveal.on{opacity:1;visibility:visible}
    .gift{position:relative;margin:0 auto;width:min(330px,74vw);aspect-ratio:4/5;display:grid;place-items:center;
      opacity:0;transform:scale(.9);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
    .gift.on{opacity:1;transform:none}
    .gift-glow{position:absolute;inset:-16%;border-radius:50%;
      background:radial-gradient(circle,rgba(220,192,138,.5) 0%,rgba(184,151,92,.16) 38%,transparent 66%)}
    .gift-plate{position:absolute;inset:0;overflow:hidden;border:1px solid var(--line);background:linear-gradient(168deg,#f5efe4,#e7ddcc)}
    .gift-plate img{width:100%;height:100%;object-fit:contain;padding:24px}
    .gift-plate::after{content:"";position:absolute;inset:9px;border:1px solid rgba(38,34,27,.1)}
    .gift-cap{margin-top:24px;opacity:0;transition:opacity 1s var(--ease)}
    .gift-cap.on{opacity:1}
    .gift-name{font-family:var(--serif);font-weight:500;font-size:clamp(24px,4vw,34px)}
    .gift-sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);margin-top:8px}
    .gift-fa{font-family:var(--nastaliq);direction:rtl;color:var(--gold2);font-size:clamp(22px,4.4vw,34px);margin-top:20px}
    .reveal-line{font-family:var(--fa);direction:rtl;font-weight:400;font-size:clamp(19px,3vw,26px);color:var(--gold2);margin-bottom:28px;min-height:1.2em}

    @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="frame" aria-hidden="true"></div>

  <!-- Stage 1 — welcome -->
  <section class="stage" data-stage="1">
    <p class="eyebrow">A moment, just for you</p>
    <h1>Happy <em>Birthday</em></h1>
    <div class="name">Zahra</div>
    <div class="rule"></div>
    <p class="fa-sub">یه لحظه‌ی کوچیک که فقط برای تو ساختم.<br />یه نفس بکش… بعد شروع کنیم.</p>
    <button class="btn btn--solid" data-next>شروع کن</button>
  </section>

  <!-- Stage 2 — the Persian note -->
  <section class="stage" data-stage="2">
    <p class="fa-note">تولدت مبارک<br />قشنگ‌ترین عشقِ دنیا</p>
    <p class="fa-love">دوستت دارم</p>
    <button class="btn" data-next>یه سوپرایز دارم…</button>
  </section>

  <!-- Stage 3 — rose → gift -->
  <section class="stage" data-stage="3">
    <div class="rose-wrap" id="rosewrap">
      <button class="rose-btn" id="rose" aria-label="Open your surprise">
        <svg viewBox="0 0 140 190">
          <defs>
            <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff3d6"/><stop offset=".5" stop-color="#dcc08a"/><stop offset="1" stop-color="#b8975c"/>
            </linearGradient>
          </defs>
          <g fill="none" stroke="url(#rg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <!-- bloom spiral -->
            <path d="M70 66 c-6 -1 -9 4 -6 8 c3 5 11 3 11 -3 c-1 -9 -12 -11 -18 -4 c-7 8 -3 21 8 23 c14 3 25 -9 21 -23"/>
            <!-- outer petals -->
            <path d="M55 60 c-13 -3 -25 7 -23 20 c1 8 6 13 13 15"/>
            <path d="M90 62 c13 -5 26 4 26 18 c0 8 -5 15 -13 18"/>
            <path d="M60 92 q10 9 22 0"/>
            <!-- calyx -->
            <path d="M58 92 c-3 6 -1 12 4 15 M82 92 c3 6 1 12 -4 15"/>
            <!-- stem -->
            <path d="M70 100 q7 40 -2 82"/>
            <!-- leaves -->
            <path d="M67 132 c-18 -7 -33 3 -33 3 s11 16 28 11 c9 -3 11 -9 5 -14 Z"/>
            <path d="M72 156 c18 -7 33 3 33 3 s-11 16 -28 11 c-9 -3 -11 -9 -5 -14 Z"/>
          </g>
        </svg>
      </button>
      <p class="rose-hint">روی گلِ رز لمس کن 🌹</p>
    </div>

    <div class="gift-reveal" id="giftreveal">
      <p class="reveal-line" id="rline"></p>
      <div class="gift" id="gift">
        <div class="gift-glow"></div>
        <div class="gift-plate"><img src="images/monogramme-nero.webp" alt="Your gift" /></div>
      </div>
      <div class="gift-cap" id="gcap">
        <div class="gift-name">Armani Exchange</div>
        <div class="gift-sub">Logo Top-Handle · Nero</div>
        <p class="gift-fa">این مالِ توئه، عشقم 🤍<br />دوستت دارم، زهرا</p>
      </div>
    </div>
  </section>

  <script>
  (function(){
    "use strict";
    var stages=[].slice.call(document.querySelectorAll('.stage')), idx=0;
    function show(i){ stages.forEach(function(s,k){s.classList.toggle('on',k===i)}); idx=i; }
    document.querySelectorAll('[data-next]').forEach(function(b){
      b.addEventListener('click',function(){ if(idx<stages.length-1) show(idx+1); });
    });
    setTimeout(function(){ show(0); },400);

    // Stage 3: rose click → bloom → gift
    var rose=document.getElementById('rose'), wrap=document.getElementById('rosewrap'),
        reveal=document.getElementById('giftreveal'), gift=document.getElementById('gift'),
        gcap=document.getElementById('gcap'), rline=document.getElementById('rline');
    var opened=false;
    rose.addEventListener('click',function(){
      if(opened) return; opened=true;
      burst(0.5,0.5,true);                 // petals from the rose
      wrap.classList.add('bloom');
      rline.textContent = 'برایت یک هدیه گرفتم…';
      setTimeout(function(){ wrap.style.display='none'; reveal.classList.add('on'); gift.classList.add('on'); },900);
      setTimeout(function(){ gcap.classList.add('on'); burst(0.5,0.42,false); },1900);
    });

    /* ---- gold + rose particles ---- */
    var cv=document.getElementById('fx'),cx=cv.getContext('2d'),W,H,DPR;
    function size(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
    size();addEventListener('resize',size);
    var dust=[],bp=[];
    for(var i=0;i<64;i++)dust.push(nd());
    function nd(){return{x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.6+.4)*DPR,s:(Math.random()*.26+.05)*DPR,a:Math.random()*.5+.15,tw:Math.random()*6.28};}
    function burst(fx,fy,rosey){var x0=W*fx,y0=H*fy,n=rosey?110:80;
      for(var i=0;i<n;i++){var an=Math.random()*6.28,sp=(Math.random()*7+2)*DPR;
        bp.push({x:x0,y:y0,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-2*DPR,r:(Math.random()*2.6+1)*DPR,life:1,rose:rosey&&Math.random()<.5});}}
    function tick(){cx.clearRect(0,0,W,H);
      for(var i=0;i<dust.length;i++){var d=dust[i];d.y-=d.s;d.tw+=.03;d.x+=Math.sin(d.tw)*.15*DPR;
        if(d.y<-5){d.y=H+5;d.x=Math.random()*W;}
        cx.beginPath();cx.fillStyle='rgba(220,192,138,'+d.a*(.6+.4*Math.sin(d.tw))+')';cx.arc(d.x,d.y,d.r,0,6.28);cx.fill();}
      for(var j=bp.length-1;j>=0;j--){var p=bp[j];p.vy+=.08*DPR;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.life-=.011;
        if(p.life<=0){bp.splice(j,1);continue;}
        var col=p.rose?'217,138,134':(Math.random()<.3?'255,244,214':'220,192,138');
        cx.beginPath();cx.fillStyle='rgba('+col+','+Math.max(0,p.life)+')';cx.arc(p.x,p.y,p.r,0,6.28);cx.fill();}
      requestAnimationFrame(tick);}
    tick();
  })();
  </script>
</body>
</html>
