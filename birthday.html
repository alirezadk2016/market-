<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A little surprise…</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0d0c0a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230d0c0a'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E" />
  <style>
    @font-face{font-family:"Cormorant Garamond";font-weight:400;src:url("fonts/cormorant-400.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Cormorant Garamond";font-weight:500;src:url("fonts/cormorant-500.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:400;src:url("fonts/cormorant-400-italic.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;src:url("fonts/cormorant-500-italic.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Jost";font-weight:300;src:url("fonts/jost-300.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Jost";font-weight:400;src:url("fonts/jost-400.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Vazirmatn";font-weight:400;src:url("fonts/vazirmatn-400.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Vazirmatn";font-weight:500;src:url("fonts/vazirmatn-500.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Gulzar";font-weight:400;src:url("fonts/gulzar-400.woff2") format("woff2");font-display:swap}

    :root{
      --bg:#0d0c0a;--ink:#ece4d4;--ink2:#cdc2ae;--muted:#8d8272;
      --gold:#b8975c;--gold2:#dcc08a;--rose:#d98a86;--line:rgba(184,151,92,.3);
      --serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost","Helvetica Neue",Arial,sans-serif;
      --fa:"Vazirmatn",Tahoma,sans-serif;--nastaliq:"Gulzar","Vazirmatn",serif;
      --ease:cubic-bezier(.22,.61,.36,1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#0d0c0a}
    body{font-family:var(--sans);font-weight:300;color:var(--ink);overflow:hidden;
      background:radial-gradient(90% 70% at 50% 30%,#171410 0%,var(--bg) 62%)}
    canvas#fx{position:fixed;inset:0;z-index:5;pointer-events:none}
    .frame{position:fixed;inset:20px;border:1px solid var(--line);z-index:1;pointer-events:none}
    @media(max-width:560px){.frame{inset:12px}}

    .stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
      justify-content:center;text-align:center;padding:44px 26px;opacity:0;visibility:hidden;
      transform:translateY(14px);transition:opacity .9s var(--ease),transform 1s var(--ease),visibility .9s}
    .stage.on{opacity:1;visibility:visible;transform:none}

    .eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold2);margin-bottom:24px}
    h1{font-family:var(--serif);font-weight:500;line-height:1.04;letter-spacing:-.01em;font-size:clamp(44px,9vw,96px)}
    h1 em{font-style:italic;background:linear-gradient(120deg,var(--gold2),#fff3d6 60%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .name{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(30px,6vw,60px);
      background:linear-gradient(120deg,var(--gold2),#fff3d6 55%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-top:6px}
    .rule{width:64px;height:1px;background:var(--gold);margin:28px 0}
    .fa-sub{font-family:var(--fa);font-weight:400;color:var(--ink2);font-size:clamp(15px,2.4vw,19px);line-height:2.1;direction:rtl;max-width:520px}

    /* Persian romantic note */
    .fa-note{font-family:var(--nastaliq);direction:rtl;color:var(--ink);line-height:2.5;
      font-size:clamp(34px,7vw,72px);
      background:linear-gradient(120deg,#fff3d6,var(--gold2) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .fa-love{font-family:var(--nastaliq);direction:rtl;color:var(--gold2);font-size:clamp(26px,5vw,46px);margin-top:18px}

    .btn{margin-top:44px;display:inline-flex;align-items:center;gap:12px;cursor:pointer;
      padding:15px 40px;border:1px solid var(--gold);background:transparent;color:var(--gold2);
      font-family:var(--fa);font-size:13px;letter-spacing:.06em;
      transition:background .45s var(--ease),color .45s var(--ease)}
    .btn:hover{background:var(--gold);color:#1b1610}
    .btn--solid{background:var(--gold);color:#1b1610}
    .btn--solid:hover{background:var(--gold2)}

    /* ---- Stage 3 · part one: the real rose ---- */
    .rose-wrap{display:flex;flex-direction:column;align-items:center;
      transition:opacity .8s var(--ease),transform .9s var(--ease)}
    .rose-btn{background:none;border:0;cursor:pointer;padding:0;position:relative;
      animation:floaty 5s ease-in-out infinite;
      transition:transform 1s var(--ease),opacity .9s var(--ease)}
    .rose-btn img{display:block;width:clamp(230px,60vw,330px);height:auto;border-radius:10px;
      box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 70px rgba(220,192,138,.14)}
    /* soft breathing halo behind the card */
    .rose-halo{position:absolute;inset:-22%;z-index:-1;border-radius:50%;
      background:radial-gradient(circle,rgba(220,192,138,.24) 0%,rgba(184,151,92,.08) 42%,transparent 68%);
      animation:halo 5s ease-in-out infinite}
    @keyframes halo{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
    /* light sweep across the card */
    .rose-btn::after{content:"";position:absolute;inset:0;border-radius:10px;overflow:hidden;pointer-events:none;
      background:linear-gradient(115deg,transparent 30%,rgba(255,243,214,.14) 46%,rgba(255,243,214,.05) 52%,transparent 62%);
      background-size:260% 100%;animation:sheen 5.5s ease-in-out infinite}
    @keyframes sheen{0%,55%{background-position:130% 0}90%,100%{background-position:-70% 0}}
    .rose-hint{font-family:var(--fa);direction:rtl;color:var(--gold2);font-size:15px;margin-top:30px;
      animation:pulse 2.4s ease-in-out infinite}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    .rose-wrap.bloom .rose-btn{transform:scale(1.35);opacity:0;pointer-events:none}
    .rose-wrap.bloom .rose-hint{opacity:0;transition:opacity .4s}

    /* ---- Stage 3 · part two: the gift atelier ---- */
    .gift-reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:34px 26px;opacity:0;visibility:hidden;transition:opacity 1.1s var(--ease),visibility 1.1s}
    .gift-reveal.on{opacity:1;visibility:visible}

    .hb-crown{width:34px;height:auto;opacity:0;transform:translateY(8px);
      transition:opacity .9s var(--ease) .15s,transform .9s var(--ease) .15s;
      filter:drop-shadow(0 0 12px rgba(220,192,138,.5))}
    .gift-reveal.on .hb-crown{opacity:1;transform:none}
    .hb-script{font-family:var(--serif);font-style:italic;font-weight:500;
      font-size:clamp(34px,7.5vw,58px);line-height:1.05;margin-top:10px;
      background:linear-gradient(120deg,var(--gold2),#fff3d6 55%,var(--gold));
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      opacity:0;transform:translateY(10px);transition:opacity 1s var(--ease) .3s,transform 1s var(--ease) .3s}
    .gift-reveal.on .hb-script{opacity:1;transform:none}
    .reveal-line{font-family:var(--fa);direction:rtl;font-weight:400;font-size:clamp(15px,2.6vw,19px);
      color:var(--ink2);margin-top:12px;opacity:0;transition:opacity 1s var(--ease) .55s}
    .gift-reveal.on .reveal-line{opacity:1}

    /* the vitrine: spotlight + rotating showcase + pedestal */
    .gift{--w:min(250px,56vw);position:relative;margin:26px auto 30px;width:var(--w);aspect-ratio:3/4;
      perspective:1300px;opacity:0;transform:translateY(26px) scale(.92);
      transition:opacity 1.1s var(--ease) .5s,transform 1.2s var(--ease) .5s;touch-action:pan-y}
    .gift.on{opacity:1;transform:none}
    .spot{position:absolute;left:50%;top:-46%;width:150%;height:74%;transform:translateX(-50%);pointer-events:none;
      background:linear-gradient(to bottom,rgba(255,243,214,.15),rgba(255,243,214,.03) 70%,transparent);
      clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(10px)}
    .gift-glow{position:absolute;inset:-16%;border-radius:50%;pointer-events:none;
      background:radial-gradient(circle,rgba(220,192,138,.32) 0%,rgba(184,151,92,.1) 40%,transparent 66%);
      animation:halo 6s ease-in-out infinite}
    .turn{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;cursor:grab}
    .turn.grabbing{cursor:grabbing}
    .face{position:absolute;inset:0;margin:0;overflow:hidden;border-radius:12px;
      border:1px solid rgba(220,192,138,.5);
      background:linear-gradient(168deg,#f6f3ee,#e9e4da);
      box-shadow:0 18px 50px rgba(0,0,0,.45);
      transform:rotateY(calc(var(--i)*90deg)) translateZ(calc(var(--w)/2 + 16px));
      backface-visibility:hidden}
    .face img{width:100%;height:100%;object-fit:cover;object-position:center 46%;display:block;transform:scale(1.28)}
    .face::before{content:"";position:absolute;inset:7px;border:1px solid rgba(38,34,27,.12);border-radius:8px;z-index:2}
    .face::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
      background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%)}
    /* pedestal — a lit jewellery ring under the bag */
    .pedestal{position:absolute;left:50%;bottom:-19%;width:132%;aspect-ratio:10/2.6;transform:translateX(-50%);pointer-events:none}
    .pedestal i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(220,192,138,.55);
      box-shadow:0 0 24px rgba(220,192,138,.25),inset 0 0 30px rgba(220,192,138,.12)}
    .pedestal i:nth-child(2){inset:16% 9%;border-color:rgba(220,192,138,.28);box-shadow:none}
    .pedestal b{position:absolute;inset:6% 2%;border-radius:50%;
      background:radial-gradient(ellipse at center,rgba(220,192,138,.24),transparent 68%);filter:blur(7px)}
    .drag-hint{font-family:var(--fa);direction:rtl;color:var(--muted);font-size:12.5px;margin-top:32px;position:relative;z-index:3;
      opacity:0;transition:opacity 1s var(--ease) 1.4s}
    .gift-reveal.on .drag-hint{opacity:.85}

    /* twinkling sparks around the vitrine */
    .spark{position:absolute;color:var(--gold2);pointer-events:none;font-size:14px;
      left:var(--x);top:var(--y);animation:twinkle 2.8s ease-in-out infinite;animation-delay:var(--d);opacity:0}
    @keyframes twinkle{0%,100%{opacity:0;transform:scale(.5) rotate(0)}50%{opacity:.9;transform:scale(1.15) rotate(40deg)}}

    .gift-cap{margin-top:20px;opacity:0;transform:translateY(10px);
      transition:opacity 1s var(--ease),transform 1s var(--ease)}
    .gift-cap.on{opacity:1;transform:none}
    .gift-name{font-family:var(--serif);font-weight:500;font-size:clamp(23px,4vw,32px)}
    .gift-sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);margin-top:8px}
    .cap-div{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:16px;color:var(--gold)}
    .cap-div::before,.cap-div::after{content:"";width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));display:block}
    .cap-div::after{background:linear-gradient(90deg,var(--gold),transparent)}
    .gift-fa{font-family:var(--nastaliq);direction:rtl;color:var(--gold2);font-size:clamp(21px,4.2vw,32px);margin-top:14px}
    .gift-cap .btn{margin-top:26px}

    /* ---- Stage 4 — cinematic finale: our photo ---- */
    .stage--photo{padding:0}
    .us-bg{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;
      filter:blur(46px) brightness(.5) saturate(1.1)}
    .us{position:relative;z-index:2;max-width:min(92vw,560px);max-height:88vh;width:auto;height:auto;
      border-radius:10px;box-shadow:0 40px 110px rgba(0,0,0,.7),0 0 90px rgba(220,192,138,.16);
      animation:breathe 12s ease-in-out infinite alternate}
    @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.025)}}
    .us-shade{position:absolute;inset:0;z-index:3;pointer-events:none;
      background:radial-gradient(125% 95% at 50% 45%,transparent 58%,rgba(0,0,0,.5) 100%)}

    @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="frame" aria-hidden="true"></div>

  <!-- Stage 1 — welcome -->
  <section class="stage" data-stage="1">
    <p class="eyebrow">A moment, just for you</p>
    <h1>Happy <em>Birthday</em></h1>
    <div class="name">Zahra</div>
    <div class="rule"></div>
    <p class="fa-sub">تقدیم به بهترین دنیا</p>
    <button class="btn btn--solid" data-next>شروع کن</button>
  </section>

  <!-- Stage 2 — the Persian note -->
  <section class="stage" data-stage="2">
    <p class="fa-note">تولدت مبارک<br />قشنگ‌ترین عشقِ دنیا</p>
    <p class="fa-love">دوستت دارم</p>
    <button class="btn" data-next>یه سوپرایز دارم…</button>
  </section>

  <!-- Stage 3 — the rose, then the gift -->
  <section class="stage" data-stage="3">
    <div class="rose-wrap" id="rosewrap">
      <button class="rose-btn" id="rose" aria-label="Open your surprise">
        <span class="rose-halo" aria-hidden="true"></span>
        <img src="images/rose-love.png" alt="For my love — a rose" />
      </button>
      <p class="rose-hint">روی رز لمس کن 🌹</p>
    </div>

    <div class="gift-reveal" id="giftreveal">
      <svg class="hb-crown" viewBox="0 0 48 30" aria-hidden="true">
        <path d="M4 24 L2 8 L13 16 L24 3 L35 16 L46 8 L44 24 Z" fill="none" stroke="#dcc08a" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="2" cy="6" r="2" fill="#dcc08a"/><circle cx="24" cy="3" r="2" fill="#fff3d6"/><circle cx="46" cy="6" r="2" fill="#dcc08a"/>
      </svg>
      <p class="hb-script">Happy Birthday</p>
      <p class="reveal-line">سوپرایز! یه چیزی برات گرفتم که فکرشم نمی‌کردی 😂🎉</p>

      <div class="gift" id="gift">
        <div class="spot" aria-hidden="true"></div>
        <div class="gift-glow" aria-hidden="true"></div>
        <div class="turn" id="turn">
          <figure class="face" style="--i:0"><img src="images/gift-front.webp"  alt="Your gift" /></figure>
          <figure class="face" style="--i:1"><img src="images/gift-detail.webp" alt="" /></figure>
          <figure class="face" style="--i:2"><img src="images/gift-back.webp"   alt="" /></figure>
          <figure class="face" style="--i:3"><img src="images/gift-inside.webp" alt="" /></figure>
        </div>
        <div class="pedestal" aria-hidden="true"><b></b><i></i><i></i></div>
        <span class="spark" style="--x:-6%;--y:22%;--d:.2s">✦</span>
        <span class="spark" style="--x:104%;--y:12%;--d:1.1s">✦</span>
        <span class="spark" style="--x:108%;--y:64%;--d:2s">✦</span>
        <span class="spark" style="--x:-10%;--y:70%;--d:1.6s">✦</span>
        <span class="spark" style="--x:50%;--y:-12%;--d:.7s">✦</span>
      </div>
      <p class="drag-hint">با انگشتت بچرخونش ✨</p>

      <div class="gift-cap" id="gcap">
        <div class="gift-name">Armani Exchange</div>
        <div class="gift-sub">Logo Top-Handle · Nero</div>
        <div class="cap-div">✦</div>
        <p class="gift-fa">تقدیم به بهترین عشق دنیا 🤍</p>
        <button class="btn" id="morebtn" style="display:none">یه چیزِ دیگه هم هست…</button>
      </div>
    </div>
  </section>

  <!-- Stage 4 — cinematic finale: our photo -->
  <section class="stage stage--photo" data-stage="4">
    <img class="us-bg" src="images/zahra-us.png" alt="" aria-hidden="true" />
    <img class="us" id="usphoto" src="images/zahra-us.png" alt="Us" />
    <div class="us-shade" aria-hidden="true"></div>
  </section>

  <script>
  (function(){
    "use strict";
    var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    var stages=[].slice.call(document.querySelectorAll('.stage')), idx=0;
    function show(i){ stages.forEach(function(s,k){s.classList.toggle('on',k===i)}); idx=i; }
    document.querySelectorAll('[data-next]').forEach(function(b){
      b.addEventListener('click',function(){ if(idx<stages.length-1) show(idx+1); });
    });
    setTimeout(function(){ show(0); },400);

    /* ---- Stage 3: rose → gift ---- */
    var rose=document.getElementById('rose'), wrap=document.getElementById('rosewrap'),
        reveal=document.getElementById('giftreveal'), gift=document.getElementById('gift'),
        gcap=document.getElementById('gcap');
    var opened=false;
    rose.addEventListener('click',function(){
      if(opened) return; opened=true;
      burst(0.5,0.5,true);
      wrap.classList.add('bloom');
      setTimeout(function(){ wrap.style.display='none'; reveal.classList.add('on'); gift.classList.add('on'); },850);
      setTimeout(function(){ confetti(); },1500);
      setTimeout(function(){ gcap.classList.add('on'); burst(0.5,0.4,false); },2100);
    });

    /* ---- The turntable: slow auto-spin + drag to rotate ---- */
    var turn=document.getElementById('turn'),
        faces=[].slice.call(turn.querySelectorAll('.face'));
    var angle=0, vel=0.22, BASE=0.22, dragging=false, lastX=0, lastT=0;
    function render(){
      turn.style.transform='rotateX(-8deg) rotateY('+angle+'deg)';
      for(var i=0;i<faces.length;i++){
        var a=((angle+i*90)%360+360)%360, c=Math.cos(a*Math.PI/180);
        faces[i].style.filter='brightness('+(0.62+0.38*Math.max(0,c)).toFixed(3)+')';
      }
    }
    if(reduced){ render(); }
    else{
      (function loop(){
        if(!dragging){ angle+=vel; vel+=(BASE-vel)*0.02; }
        render(); requestAnimationFrame(loop);
      })();
      gift.addEventListener('pointerdown',function(e){
        dragging=true; lastX=e.clientX; lastT=performance.now();
        turn.classList.add('grabbing'); gift.setPointerCapture&&gift.setPointerCapture(e.pointerId);
      });
      gift.addEventListener('pointermove',function(e){
        if(!dragging) return;
        var now=performance.now(), dx=e.clientX-lastX;
        angle+=dx*0.45;
        vel=Math.max(-6,Math.min(6,dx*0.45/Math.max(1,now-lastT)*16));
        lastX=e.clientX; lastT=now;
      });
      function drop(){ dragging=false; turn.classList.remove('grabbing'); }
      gift.addEventListener('pointerup',drop);
      gift.addEventListener('pointercancel',drop);
    }

    /* ---- Stage 4: only offer the finale once the couple photo loads ---- */
    var morebtn=document.getElementById('morebtn'), usphoto=document.getElementById('usphoto');
    function armMore(){ morebtn.style.display='inline-flex'; }
    if(usphoto.complete && usphoto.naturalWidth>0) armMore();
    usphoto.addEventListener('load',armMore);
    usphoto.addEventListener('error',function(){ morebtn.style.display='none'; });
    morebtn.addEventListener('click',function(){ show(stages.length-1); burst(0.5,0.5,true); confetti(); });

    /* ---- gold dust, petal bursts & confetti ---- */
    var cv=document.getElementById('fx'),cx=cv.getContext('2d'),W,H,DPR;
    function size(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
    size();addEventListener('resize',size);
    var dust=[],bp=[],cf=[];
    for(var i=0;i<64;i++)dust.push(nd());
    function nd(){return{x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.6+.4)*DPR,s:(Math.random()*.26+.05)*DPR,a:Math.random()*.5+.15,tw:Math.random()*6.28};}
    function burst(fx,fy,rosey){var x0=W*fx,y0=H*fy,n=rosey?110:80;
      for(var i=0;i<n;i++){var an=Math.random()*6.28,sp=(Math.random()*7+2)*DPR;
        bp.push({x:x0,y:y0,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-2*DPR,r:(Math.random()*2.6+1)*DPR,life:1,rose:rosey&&Math.random()<.5});}}
    var CCOLS=['220,192,138','255,243,214','184,151,92','217,138,134'];
    function confetti(){
      if(reduced) return;
      for(var i=0;i<120;i++){
        cf.push({x:Math.random()*W,y:-Math.random()*H*0.25-10*DPR,
          vx:(Math.random()-.5)*1.4*DPR,vy:(Math.random()*1.8+1.2)*DPR,
          w:(Math.random()*7+4)*DPR,h:(Math.random()*4+2.4)*DPR,
          rot:Math.random()*6.28,vr:(Math.random()-.5)*.22,sw:Math.random()*6.28,
          col:CCOLS[(Math.random()*CCOLS.length)|0],life:1});
      }
    }
    function tick(){cx.clearRect(0,0,W,H);
      for(var i=0;i<dust.length;i++){var d=dust[i];d.y-=d.s;d.tw+=.03;d.x+=Math.sin(d.tw)*.15*DPR;
        if(d.y<-5){d.y=H+5;d.x=Math.random()*W;}
        cx.beginPath();cx.fillStyle='rgba(220,192,138,'+d.a*(.6+.4*Math.sin(d.tw))+')';cx.arc(d.x,d.y,d.r,0,6.28);cx.fill();}
      for(var j=bp.length-1;j>=0;j--){var p=bp[j];p.vy+=.08*DPR;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.life-=.011;
        if(p.life<=0){bp.splice(j,1);continue;}
        var col=p.rose?'217,138,134':(Math.random()<.3?'255,244,214':'220,192,138');
        cx.beginPath();cx.fillStyle='rgba('+col+','+Math.max(0,p.life)+')';cx.arc(p.x,p.y,p.r,0,6.28);cx.fill();}
      for(var k=cf.length-1;k>=0;k--){var c=cf[k];c.sw+=.05;c.x+=c.vx+Math.sin(c.sw)*.5*DPR;c.y+=c.vy;c.rot+=c.vr;
        if(c.y>H*0.82)c.life-=.03;
        if(c.life<=0||c.y>H+20){cf.splice(k,1);continue;}
        cx.save();cx.translate(c.x,c.y);cx.rotate(c.rot);
        cx.fillStyle='rgba('+c.col+','+Math.max(0,c.life)+')';
        cx.fillRect(-c.w/2,-c.h/2,c.w,c.h);cx.restore();}
      requestAnimationFrame(tick);}
    tick();
  })();
  </script>
