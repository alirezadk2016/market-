<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>A.z — Control Panel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23130d0e'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-style='italic' font-size='30' fill='%23c9a879' text-anchor='middle'%3EAZ%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="boot" id="boot"><span>Loading the collection…</span></div>

  <header class="bar">
    <span class="mark">A.z <em>Control Panel</em></span>
    <span class="bar-mid" id="dirty"></span>
    <div class="bar-actions">
      <button class="btn ghost kbd" id="btnFind" title="Go to anything">Go to <b>⌘K</b></button>
      <a class="btn ghost" href="index.html" target="_blank" rel="noopener">View site</a>
      <button class="btn ghost" id="btnDownload">Download</button>
      <button class="btn solid" id="btnPublish">Publish</button>
    </div>
  </header>

  <div class="shell">
    <nav class="side">
      <p class="side-label">Collections</p>
      <ul class="side-list" id="navCollections"></ul>
      <button class="side-add" id="btnAddCollection">+ New collection</button>
      <p class="side-label">Before you publish</p>
      <ul class="side-list">
        <li><button class="side-item" data-view="health"><b>What needs attention</b><span></span></button></li>
      </ul>
      <p class="side-label">Site</p>
      <ul class="side-list">
        <li><button class="side-item" data-view="site">Words &amp; pictures</button></li>
        <li><button class="side-item" data-view="markers">Scene markers</button></li>
        <li><button class="side-item" data-view="advisory">The Advisory page</button></li>
        <li><button class="side-item" data-view="eyewear">The Eyewear room</button></li>
        <li><button class="side-item" data-view="houses">The Houses</button></li>
        <li><button class="side-item" data-view="settings">Publishing</button></li>
      </ul>
      <p class="side-foot">Writes <code>bags.js</code> and <code>content.js</code>. Nothing is live until you publish.</p>
      <p class="side-keys">
        <b>⌘K</b> go to anything<br />
        <b>⌘Z</b> undo<br />
        <b>⌘S</b> publish
      </p>
    </nav>

    <main class="work" id="work"></main>
  </div>

  <!-- editing a piece happens over the top of everything -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Edit piece">
      <header class="sheet-head">
        <h2 id="sheetTitle">Piece</h2>
        <div>
          <button class="btn ghost" id="sheetCancel">Cancel</button>
          <button class="btn solid" id="sheetSave">Done</button>
        </div>
      </header>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <!-- everything in the panel, one keystroke away -->
  <div class="palette" id="palette" hidden>
    <div class="pal-panel" role="dialog" aria-modal="true" aria-label="Go to">
      <input type="text" id="palInput" placeholder="Go to a piece, a collection, a house…" autocomplete="off" spellcheck="false" />
      <ul class="pal-list" id="palList"></ul>
      <p class="pal-foot"><b>↑↓</b> to move &nbsp;·&nbsp; <b>↵</b> to open &nbsp;·&nbsp; <b>esc</b> to close</p>
    </div>
  </div>

  <!-- questions are asked inside the panel, not by the browser -->
  <div class="modal" id="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
      <input type="text" id="modalInput" hidden />
      <div class="modal-acts">
        <button class="btn ghost" id="modalNo">Cancel</button>
        <button class="btn solid" id="modalYes">Continue</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="admin.js"></script>
</body>
</html>
